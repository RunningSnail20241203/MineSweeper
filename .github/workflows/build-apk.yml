name: Build and Release APK

on:
  push:
    tags:
      - 'v*'          # 只有推送 v1.0、v1.0.1 这类 tag 时才触发
  workflow_dispatch:   # 保留手动触发，方便测试

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload Artifact (可选)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}   # 直接用你推送的 tag 名，如 v1.0
          name: "Release ${{ github.ref_name }}"
          body: "由 GitHub Actions 自动编译生成的 APK"
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
