plugins {
    id 'com.android.application' version '8.11.1'
}

def readEnvironment = { name -> providers.environmentVariable(name).orElse('').get() }
def releaseKeystore = readEnvironment('MINESWEEPER_KEYSTORE')
def releaseStorePassword = readEnvironment('MINESWEEPER_KEYSTORE_PASSWORD')
def releaseKeyAlias = readEnvironment('MINESWEEPER_KEY_ALIAS')
def releaseKeyPassword = readEnvironment('MINESWEEPER_KEY_PASSWORD')

android {
    namespace = 'com.local.minesweeper'
    compileSdk = 36
    buildToolsVersion = '35.0.0'

    defaultConfig {
        applicationId = 'com.YYYAndWZ.MineSweeper'
        minSdk = 23
        targetSdk = 34
        versionCode = providers.gradleProperty('minesweeperVersionCode').get().toInteger()
        versionName = providers.gradleProperty('minesweeperVersionName').get()
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        debug {
            storeFile = file('../build/debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
        release {
            if (releaseKeystore) storeFile = file(releaseKeystore)
            storePassword = releaseStorePassword
            keyAlias = releaseKeyAlias
            keyPassword = releaseKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }

    sourceSets {
        main {
            manifest.srcFile '../src/main/AndroidManifest.xml'
            java.srcDir '../src/main/java'
            res.srcDir '../src/main/res'
        }
    }
}

def validateReleaseInputs = tasks.register('validateReleaseInputs') {
    doLast {
        def required = [
            MINESWEEPER_KEYSTORE: releaseKeystore,
            MINESWEEPER_KEYSTORE_PASSWORD: releaseStorePassword,
            MINESWEEPER_KEY_ALIAS: releaseKeyAlias,
            MINESWEEPER_KEY_PASSWORD: releaseKeyPassword
        ]
        def missing = required.findAll { name, value -> !value }.keySet()
        if (missing) throw new GradleException("Set environment variables for the release APK: ${missing.join(', ')}")
        def keystore = file(releaseKeystore).canonicalFile
        if (!keystore.isFile()) throw new GradleException('MINESWEEPER_KEYSTORE does not point to a keystore file.')
        if (keystore == file('../build/debug.keystore').canonicalFile ||
                releaseKeyAlias.equalsIgnoreCase('androiddebugkey')) {
            throw new GradleException('Use the dedicated release signing key.')
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn validateReleaseInputs
}

